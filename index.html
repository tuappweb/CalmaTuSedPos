<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Clave para móviles: ancho real del dispositivo y uso de toda la pantalla (notch incluido) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Modo "app" al agregar a pantalla de inicio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <title>CalmaTuSedPos</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;           /* evita doble scroll (página + iframe) */
      background: #ffffff;
      overscroll-behavior: none;  /* evita "pull to refresh" accidental */
    }
    iframe {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbytttcThniYsIyvs9a5dTFlEn-beFrDAPphp39d5FwZFHuzZZWfxpd1QPoAbc1maTP0/exec"
    title="CalmaTuSedPos"></iframe>
</body>
</html>
